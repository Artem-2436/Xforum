<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форум разработчиков</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #ffffff;
            color: #000000;
            overflow-x: hidden;
        }

        /* Glass Effect */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* Auth Modal */
        .auth-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .auth-container {
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 20px;
        }

        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .auth-tab {
            flex: 1;
            padding: 0.75rem;
            border: none;
            background: transparent;
            color: #666;
            font-size: 1rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .auth-tab.active {
            color: #000;
            border-bottom-color: #000;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .auth-form input {
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.9);
        }

        .auth-form button {
            padding: 0.75rem;
            border: none;
            border-radius: 10px;
            background: #000;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .auth-form button:hover {
            opacity: 0.8;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            padding: 1.5rem;
            border-right: 1px solid rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            transition: transform 0.3s;
        }

        .sidebar.hidden {
            transform: translateX(-100%);
        }

        .menu-toggle {
            display: none;
            position: fixed;
            top: 1rem;
            right: 1rem;
            width: 40px;
            height: 40px;
            border: none;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            cursor: pointer;
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .menu-toggle span {
            width: 20px;
            height: 2px;
            background: #000;
            transition: all 0.3s;
        }

        .sidebar-section {
            margin-bottom: 2rem;
        }

        .sidebar-title {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #666;
            text-transform: uppercase;
        }

        .chat-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .chat-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .chat-item.active {
            background: #000;
            color: #fff;
        }

        /* Main Content */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .content-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .content-header h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .view-switcher {
            display: flex;
            gap: 0.5rem;
        }

        .view-btn {
            padding: 0.5rem 1rem;
            border: 1px solid #000;
            background: transparent;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .view-btn.active {
            background: #000;
            color: #fff;
        }

        /* Chat View */
        .chat-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .message {
            margin-bottom: 1rem;
            padding: 1rem;
            border-radius: 15px;
            max-width: 70%;
        }

        .message.own {
            margin-left: auto;
            background: #000;
            color: #fff;
        }

        .message.other {
            background: rgba(0, 0, 0, 0.05);
        }

        .message-author {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .message-content {
            word-wrap: break-word;
        }

        .message-input-container {
            padding: 1.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 0.5rem;
        }

        .message-input-container input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 1rem;
        }

        .message-input-container button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 20px;
            background: #000;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .message-input-container button:hover {
            opacity: 0.8;
        }

        /* Blog View */
        .blog-view {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: none;
        }

        .blog-post {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.05);
        }

        .blog-post-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
            color: #666;
        }

        .blog-post-content {
            margin-bottom: 0.75rem;
            line-height: 1.5;
        }

        .blog-post-actions {
            display: flex;
            gap: 1rem;
        }

        .blog-action-btn {
            padding: 0.5rem 1rem;
            border: none;
            background: transparent;
            color: #000;
            cursor: pointer;
            font-size: 0.875rem;
            transition: opacity 0.3s;
        }

        .blog-action-btn:hover {
            opacity: 0.6;
        }

        .blog-reply {
            margin-left: 2rem;
            padding: 0.75rem;
            border-left: 2px solid rgba(0, 0, 0, 0.1);
            margin-top: 0.75rem;
        }

        .new-blog-form {
            padding: 1.5rem;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            display: none;
        }

        .new-blog-form textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            resize: vertical;
            min-height: 100px;
            margin-bottom: 0.5rem;
        }

        .new-blog-form button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            background: #000;
            color: #fff;
            cursor: pointer;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                z-index: 99;
                transform: translateX(-100%);
            }

            .sidebar.visible {
                transform: translateX(0);
            }

            .menu-toggle {
                display: flex;
            }

            .message {
                max-width: 85%;
            }

            .blog-reply {
                margin-left: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Auth Modal -->
    <div class="auth-modal" id="authModal">
        <div class="auth-container glass">
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">Вход</button>
                <button class="auth-tab" data-tab="register">Регистрация</button>
            </div>
            
            <form class="auth-form" id="loginForm">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Пароль" required>
                <button type="submit">Войти</button>
            </form>

            <form class="auth-form" id="registerForm" style="display: none;">
                <input type="text" placeholder="Имя пользователя" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Пароль" required>
                <button type="submit">Зарегистрироваться</button>
            </form>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container" style="display: none;" id="mainContainer">
        <!-- Menu Toggle -->
        <button class="menu-toggle" id="menuToggle">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- Sidebar -->
        <aside class="sidebar glass" id="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Чаты</div>
                <div id="chatList"></div>
            </div>
        </aside>

        <!-- Content -->
        <main class="content">
            <div class="content-header glass">
                <h2 id="currentViewTitle">Главный зал</h2>
                <div class="view-switcher">
                    <button class="view-btn active" data-view="chat">Чат</button>
                    <button class="view-btn" data-view="private">Переписки</button>
                    <button class="view-btn" data-view="blog">Блог</button>
                </div>
            </div>

            <!-- Chat View -->
            <div class="chat-view" id="chatView">
                <div class="messages-container" id="messagesContainer"></div>
                <div class="message-input-container">
                    <input type="text" placeholder="Введите сообщение..." id="messageInput">
                    <button id="sendMessageBtn">Отправить</button>
                </div>
            </div>

            <!-- Blog View -->
            <div class="blog-view" id="blogView">
                <div id="blogPosts"></div>
            </div>

            <!-- New Blog Form -->
            <div class="new-blog-form" id="newBlogForm">
                <textarea placeholder="Напишите что-нибудь..." id="blogInput"></textarea>
                <button id="postBlogBtn">Опубликовать</button>
            </div>
        </main>
    </div>
    <script>

    // Supabase конфигурация
const SUPABASE_URL = 'https://epklfzbvlqzarptpwsdn.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_aa5ojwVrZ7pfLE0ec0DV5w_p3Zk2fcn';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Состояние приложения
let currentUser = null;
let currentChatRoom = 1;
let currentView = 'chat';

// Элементы DOM
const authModal = document.getElementById('authModal');
const mainContainer = document.getElementById('mainContainer');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');
const authTabs = document.querySelectorAll('.auth-tab');
const chatList = document.getElementById('chatList');
const messagesContainer = document.getElementById('messagesContainer');
const messageInput = document.getElementById('messageInput');
const sendMessageBtn = document.getElementById('sendMessageBtn');
const blogView = document.getElementById('blogView');
const chatView = document.getElementById('chatView');
const newBlogForm = document.getElementById('newBlogForm');
const blogPosts = document.getElementById('blogPosts');
const blogInput = document.getElementById('blogInput');
const postBlogBtn = document.getElementById('postBlogBtn');
const menuToggle = document.getElementById('menuToggle');
const sidebar = document.getElementById('sidebar');

// Переключение вкладок авторизации
authTabs.forEach(tab => {
    tab.addEventListener('click', () => {
        authTabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        if (tab.dataset.tab === 'login') {
            loginForm.style.display = 'flex';
            registerForm.style.display = 'none';
        } else {
            loginForm.style.display = 'none';
            registerForm.style.display = 'flex';
        }
    });
});

// Регистрация
// Регистрация
// Регистрация
registerForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = registerForm.querySelector('input[type="text"]').value;
    const email = registerForm.querySelector('input[type="email"]').value;
    const password = registerForm.querySelector('input[type="password"]').value;

    const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
            data: { username: username },
            emailRedirectTo: window.location.origin
        }
    });

    if (error) {
        alert('Ошибка регистрации: ' + error.message);
        return;
    }

    // Если email не требует подтверждения, сразу входим
    if (data.user && !data.user.identities?.[0]?.identity_data?.email_verified) {
        // Пытаемся сразу войти
        const { data: signInData, error: signInError } = await supabaseClient.auth.signInWithPassword({
            email,
            password
        });
        
        if (signInError) {
            console.error('Ошибка автовхода:', signInError);
            alert('Регистрация успешна!');
        } else {
            currentUser = signInData.user;
            authModal.style.display = 'none';
            mainContainer.style.display = 'flex';
            loadChatRooms();
            loadMessages();
        }
    } else if (data.session) {
        // Если сессия уже создана (email подтвержден автоматически)
        currentUser = data.user;
        authModal.style.display = 'none';
        mainContainer.style.display = 'flex';
        loadChatRooms();
        loadMessages();
    } else {
        alert('Регистрация успешна');
    }
});

// Вход
// Вход
loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = loginForm.querySelector('input[type="email"]').value;
    const password = loginForm.querySelector('input[type="password"]').value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        if (error.message === 'Email not confirmed') {
            alert('Пожалуйста, потвердите ваш email адрес или обратитесь в службу поддержки');
        } else {
            alert('Ошибка входа: ' + error.message);
        }
    } else {
        currentUser = data.user;
        authModal.style.display = 'none';
        mainContainer.style.display = 'flex';
        loadChatRooms();
        loadMessages();
    }
});

// Загрузка чатов
async function loadChatRooms() {
    const { data, error } = await supabaseClient
        .from('chat_rooms')
        .select('*');

    if (error) {
        console.error('Ошибка загрузки чатов:', error);
        return;
    }

    chatList.innerHTML = '';
    data.forEach(room => {
        const item = document.createElement('div');
        item.className = 'chat-item' + (room.id === currentChatRoom ? ' active' : '');
        item.textContent = room.name;
        item.addEventListener('click', () => {
            currentChatRoom = room.id;
            document.getElementById('currentViewTitle').textContent = room.name;
            loadMessages();
            loadChatRooms();
            if (window.innerWidth <= 768) {
                sidebar.classList.remove('visible');
            }
        });
        chatList.appendChild(item);
    });
}

// Загрузка сообщений
async function loadMessages() {
    const { data, error } = await supabaseClient
        .from('messages')
        .select(`
            *,
            profiles (username)
        `)
        .eq('chat_room_id', currentChatRoom)
        .order('created_at', { ascending: true });

    if (error) {
        console.error('Ошибка загрузки сообщений:', error);
        return;
    }

    messagesContainer.innerHTML = '';
    data.forEach(msg => {
        const messageEl = document.createElement('div');
        messageEl.className = 'message ' + (msg.user_id === currentUser.id ? 'own' : 'other');
        messageEl.innerHTML = `
            <div class="message-author">${msg.profiles.username}</div>
            <div class="message-content">${msg.content}</div>
        `;
        messagesContainer.appendChild(messageEl);
    });

    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

// Отправка сообщения
sendMessageBtn.addEventListener('click', sendMessage);
messageInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
});

async function sendMessage() {
    const content = messageInput.value.trim();
    if (!content) return;

    const { error } = await supabaseClient
        .from('messages')
        .insert({
            chat_room_id: currentChatRoom,
            user_id: currentUser.id,
            content: content
        });

    if (error) {
        console.error('Ошибка отправки:', error);
    } else {
        messageInput.value = '';
        loadMessages();
    }
}

// Переключение видов
document.querySelectorAll('.view-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentView = btn.dataset.view;

        if (currentView === 'chat') {
            chatView.style.display = 'flex';
            blogView.style.display = 'none';
            newBlogForm.style.display = 'none';
        } else if (currentView === 'blog') {
            chatView.style.display = 'none';
            blogView.style.display = 'block';
            newBlogForm.style.display = 'block';
            loadBlogs();
        }
    });
});

// Загрузка блогов
async function loadBlogs() {
    const { data, error } = await supabaseClient
        .from('blogs')
        .select(`
            *,
            profiles (username)
        `)
        .is('parent_id', null)
        .order('created_at', { ascending: false });

    if (error) {
        console.error('Ошибка загрузки блогов:', error);
        return;
    }

    blogPosts.innerHTML = '';
    for (const post of data) {
        await renderBlogPost(post);
    }
}

async function renderBlogPost(post, isReply = false) {
    const postEl = document.createElement('div');
    postEl.className = isReply ? 'blog-reply' : 'blog-post';
    postEl.innerHTML = `
        <div class="blog-post-header">
            <strong>${post.profiles.username}</strong>
            <span>•</span>
            <span>${new Date(post.created_at).toLocaleString('ru-RU')}</span>
        </div>
        <div class="blog-post-content">${post.content}</div>
        <div class="blog-post-actions">
            <button class="blog-action-btn" data-id="${post.id}">Ответить</button>
        </div>
    `;

    const replyBtn = postEl.querySelector('.blog-action-btn');
    replyBtn.addEventListener('click', () => {
        const replyContent = prompt('Ваш ответ:');
        if (replyContent) {
            postReply(post.id, replyContent);
        }
    });

    blogPosts.appendChild(postEl);

    // Загрузка ответов
    const { data: replies } = await supabaseClient
        .from('blogs')
        .select(`
            *,
            profiles (username)
        `)
        .eq('parent_id', post.id)
        .order('created_at', { ascending: true });

    if (replies) {
        for (const reply of replies) {
            await renderBlogPost(reply, true);
        }
    }
}

// Публикация блога
postBlogBtn.addEventListener('click', async () => {
    const content = blogInput.value.trim();
    if (!content) return;

    const { error } = await supabaseClient
        .from('blogs')
        .insert({
            user_id: currentUser.id,
            content: content
        });

    if (error) {
        console.error('Ошибка публикации:', error);
    } else {
        blogInput.value = '';
        loadBlogs();
    }
});

// Ответ на блог
async function postReply(parentId, content) {
    const { error } = await supabaseClient
        .from('blogs')
        .insert({
            user_id: currentUser.id,
            content: content,
            parent_id: parentId
        });

    if (error) {
        console.error('Ошибка ответа:', error);
    } else {
        loadBlogs();
    }
}

// Мобильное меню
menuToggle.addEventListener('click', () => {
    sidebar.classList.toggle('visible');
});

// Проверка сессии
supabaseClient.auth.getSession().then(({ data: { session } }) => {
    if (session) {
        currentUser = session.user;
        authModal.style.display = 'none';
        mainContainer.style.display = 'flex';
        loadChatRooms();
        loadMessages();
    }
});

// Слушатель изменений авторизации
supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
        currentUser = session.user;
        authModal.style.display = 'none';
        mainContainer.style.display = 'flex';
        loadChatRooms();
        loadMessages();
    } else if (event === 'SIGNED_OUT') {
        currentUser = null;
        authModal.style.display = 'flex';
        mainContainer.style.display = 'none';
    }
});
</script>
</body>
</html>
