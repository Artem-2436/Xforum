<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форум разработчиков | Xcortex</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: rgba(255, 255, 255, 0.7);
            --text-primary: #000000;
            --text-secondary: #666666;
            --border-color: rgba(0, 0, 0, 0.1);
            --hover-bg: rgba(0, 0, 0, 0.05);
            --active-bg: #000000;
            --active-text: #ffffff;
            --accent-color: #6366f1; /* Indigo for consistency with other projects */
        }

        [data-theme="dark"] {
            --bg-primary: #1a1a1a;
            --bg-secondary: rgba(40, 40, 40, 0.7);
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --border-color: rgba(255, 255, 255, 0.1);
            --hover-bg: rgba(255, 255, 255, 0.05);
            --active-bg: #ffffff;
            --active-text: #000000;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background 0.3s, color 0.3s;
        }

        /* Glass Effect */
        .glass {
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        /* Loader Styles */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        
        .spinner-dark {
            border: 3px solid rgba(0,0,0,0.1);
            border-top-color: var(--accent-color);
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Full Screen Overlay Loader */
        #global-loader-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-primary);
            z-index: 9999;
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        #global-loader-overlay.active { display: flex; }
        .loader-text { font-size: 1.2rem; color: var(--text-secondary); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Auth Modal */
        .auth-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .auth-container {
            width: 90%; max-width: 400px;
            padding: 2rem;
            border-radius: 20px;
            text-align: center;
        }

        .auth-title { font-size: 1.5rem; margin-bottom: 1.5rem; font-weight: bold; }

        /* Tabs in Auth */
        .auth-tabs {
            display: flex; gap: 10px; margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .tab-btn {
            flex: 1; background: none; border: none;
            color: var(--text-secondary); font-weight: 600;
            cursor: pointer; padding: 8px; transition: all 0.2s;
        }
        .tab-btn.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); }

        .auth-form-group { display: none; }
        .auth-form-group.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .github-btn {
            width: 100%; padding: 1rem;
            border: none; border-radius: 10px;
            background: #24292e; color: white;
            font-size: 1rem; cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .github-btn:hover:not(:disabled) { opacity: 0.9; transform: translateY(-2px); }
        .github-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .github-icon { width: 20px; height: 20px; fill: currentColor; }

        .email-input-group {
            display: flex; gap: 10px; margin-bottom: 15px;
        }
        .email-input {
            flex: 1; padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 1rem;
        }
        .send-email-btn {
            padding: 0.75rem 1rem;
            border: none; border-radius: 10px;
            background: var(--accent-color); color: white;
            cursor: pointer; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            min-width: 100px;
        }
        .send-email-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .status-msg {
            font-size: 0.85rem; margin-top: 10px; min-height: 20px;
            color: var(--text-secondary);
        }
        .status-msg.error { color: #ef4444; }
        .status-msg.success { color: #22c55e; }

        /* Main Layout */
        .main-container {
            display: none; /* Changed to none initially */
            height: 100vh;
        }
        .main-container.visible { display: flex; }

        /* Sidebar */
        .sidebar {
            width: 280px; padding: 1.5rem;
            border-right: 1px solid var(--border-color);
            overflow-y: auto; transition: transform 0.3s;
        }
        .menu-toggle {
            display: none; position: fixed; top: 1rem; right: 1rem;
            width: 40px; height: 40px; border: none;
            background: var(--hover-bg); border-radius: 10px;
            cursor: pointer; z-index: 100;
            flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        }
        .menu-toggle span { width: 20px; height: 2px; background: var(--text-primary); transition: all 0.3s; }

        .sidebar-section { margin-bottom: 2rem; }
        .sidebar-title { font-size: 0.875rem; font-weight: 600; margin-bottom: 0.75rem; color: var(--text-secondary); text-transform: uppercase; }
        .chat-item {
            padding: 0.75rem 1rem; margin-bottom: 0.5rem;
            border-radius: 10px; cursor: pointer; transition: background 0.3s;
        }
        .chat-item:hover { background: var(--hover-bg); }
        .chat-item.active { background: var(--active-bg); color: var(--active-text); }

        /* Content */
        .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .content-header {
            padding: 1.5rem; border-bottom: 1px solid var(--border-color);
            display: flex; flex-direction: column; gap: 1rem;
        }
        .content-header-top { display: flex; align-items: center; justify-content: space-between; }
        .content-header h2 { font-size: 1.5rem; }
        .header-buttons { display: flex; gap: 0.5rem; }
        .icon-btn {
            width: 40px; height: 40px; border: 1px solid var(--border-color);
            background: transparent; border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; color: var(--text-primary); font-size: 1.2rem;
        }
        .icon-btn:hover { background: var(--hover-bg); }

        .view-switcher { display: flex; gap: 0.5rem; }
        .view-btn {
            padding: 0.5rem 1rem; border: 1px solid var(--text-primary);
            background: transparent; color: var(--text-primary);
            border-radius: 20px; cursor: pointer; transition: all 0.3s;
        }
        .view-btn.active { background: var(--active-bg); color: var(--active-text); }

        /* Chat View */
        .chat-view { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .messages-container { flex: 1; overflow-y: auto; padding: 1.5rem; }
        .message {
            margin-bottom: 1rem; padding: 1rem; border-radius: 15px; max-width: 70%;
        }
        .message.own { margin-left: auto; background: var(--active-bg); color: var(--active-text); }
        .message.other { background: var(--hover-bg); }
        .message-author { font-size: 0.875rem; font-weight: 600; margin-bottom: 0.5rem; }
        .message-content { word-wrap: break-word; }

        .message-input-container {
            padding: 1.5rem; border-top: 1px solid var(--border-color);
            display: flex; gap: 0.5rem;
        }
        .message-input-container input {
            flex: 1; padding: 0.75rem 1rem; border: 1px solid var(--border-color);
            border-radius: 20px; font-size: 1rem; background: var(--bg-secondary); color: var(--text-primary);
        }
        .message-input-container button {
            padding: 0.75rem 1.5rem; border: none; border-radius: 20px;
            background: var(--active-bg); color: var(--active-text); cursor: pointer; transition: opacity 0.3s;
        }
        .message-input-container button:hover { opacity: 0.8; }

        /* Blog View */
        .blog-view { flex: 1; overflow-y: auto; padding: 1.5rem; display: none; }
        .blog-post { padding: 1rem; margin-bottom: 1rem; border-radius: 15px; background: var(--hover-bg); }
        .blog-post-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; font-size: 0.875rem; color: var(--text-secondary); }
        .blog-post-content { margin-bottom: 0.75rem; line-height: 1.5; }
        .blog-post-actions { display: flex; gap: 1rem; }
        .blog-action-btn { padding: 0.5rem 1rem; border: none; background: transparent; color: var(--text-primary); cursor: pointer; font-size: 0.875rem; transition: opacity 0.3s; }
        .blog-action-btn:hover { opacity: 0.6; }
        .blog-reply { margin-left: 2rem; padding: 0.75rem; border-left: 2px solid var(--border-color); margin-top: 0.75rem; }

        .new-blog-form { padding: 1.5rem; border-top: 1px solid var(--border-color); display: none; }
        .new-blog-form textarea {
            width: 100%; padding: 0.75rem; border: 1px solid var(--border-color);
            border-radius: 10px; font-size: 1rem; resize: vertical; min-height: 100px;
            margin-bottom: 0.5rem; background: var(--bg-secondary); color: var(--text-primary);
        }
        .new-blog-form button {
            padding: 0.75rem 1.5rem; border: none; border-radius: 10px;
            background: var(--active-bg); color: var(--active-text); cursor: pointer;
        }

        /* Settings Modal */
        .settings-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); display: none;
            align-items: center; justify-content: center; z-index: 1001;
        }
        .settings-modal.visible { display: flex; }
        .settings-container {
            width: 90%; max-width: 500px; padding: 2rem; border-radius: 20px;
            max-height: 90vh; overflow-y: auto;
        }
        .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .settings-header h3 { font-size: 1.5rem; }
        .close-btn { width: 30px; height: 30px; border: none; background: transparent; font-size: 1.5rem; cursor: pointer; color: var(--text-primary); }
        .settings-section { margin-bottom: 2rem; }
        .settings-section h4 { margin-bottom: 1rem; font-size: 1.1rem; }
        .theme-toggle { display: flex; align-items: center; gap: 1rem; }
        .toggle-switch {
            position: relative; width: 60px; height: 30px;
            background: var(--hover-bg); border-radius: 15px; cursor: pointer; transition: background 0.3s;
        }
        .toggle-switch.active { background: var(--active-bg); }
        .toggle-slider {
            position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
            background: var(--bg-primary); border-radius: 50%; transition: transform 0.3s;
        }
        .toggle-switch.active .toggle-slider { transform: translateX(30px); }
        .danger-btn { background: #dc3545 !important; color: white !important; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar { position: fixed; top: 0; left: 0; height: 100%; z-index: 99; transform: translateX(-100%); }
            .sidebar.visible { transform: translateX(0); }
            .menu-toggle { display: flex; }
            .message { max-width: 85%; }
            .blog-reply { margin-left: 1rem; }
        }
    </style>
</head>
<body>
    <!-- Global Loading Overlay for Magic Link Redirect -->
    <div id="global-loader-overlay">
        <div class="spinner spinner-dark" style="width: 40px; height: 40px; border-width: 4px;"></div>
        <div class="loader-text">Проверяем авторизацию...</div>
    </div>

    <!-- Auth Modal -->
    <div class="auth-modal" id="authModal">
        <div class="auth-container glass">
            <h2 class="auth-title">Вход в Форум</h2>
            
            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchAuthTab('github')">GitHub</button>
                <button class="tab-btn" onclick="switchAuthTab('email')">Email</button>
            </div>

            <!-- GitHub Form -->
            <div id="form-github" class="auth-form-group active">
                <button class="github-btn" id="githubLoginBtn">
                    <svg class="github-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                    </svg>
                    Sign in via GitHub
                </button>
                <div class="status-msg" id="github-status"></div>
            </div>

            <!-- Email Form -->
            <div id="form-email" class="auth-form-group">
                <div class="email-input-group">
                    <input type="email" id="login-email" class="email-input" placeholder="your@email.com">
                    <button class="send-email-btn" id="sendMagicLinkBtn">Отправить</button>
                </div>
                <div class="status-msg" id="email-status">Мы отправим ссылку для входа на вашу почту.</div>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="main-container" id="mainContainer">
        <!-- Menu Toggle -->
        <button class="menu-toggle" id="menuToggle">
            <span></span><span></span><span></span>
        </button>

        <!-- Sidebar -->
        <aside class="sidebar glass" id="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Чаты</div>
                <div id="chatList"></div>
            </div>
        </aside>

        <!-- Content -->
        <main class="content">
            <div class="content-header glass">
                <div class="content-header-top">
                    <h2 id="currentViewTitle">Главный зал</h2>
                    <div class="header-buttons">
                        <button class="icon-btn" id="settingsBtn" title="Настройки">⚙️</button>
                        <button class="icon-btn" id="logoutBtn" title="Выйти">🚪</button>
                    </div>
                </div>
                <div class="view-switcher">
                    <button class="view-btn active" data-view="chat">Чат</button>
                    <button class="view-btn" data-view="private">Переписки</button>
                    <button class="view-btn" data-view="blog">Блог</button>
                </div>
            </div>

            <!-- Chat View -->
            <div class="chat-view" id="chatView">
                <div class="messages-container" id="messagesContainer"></div>
                <div class="message-input-container">
                    <input type="text" placeholder="Введите сообщение..." id="messageInput">
                    <button id="sendMessageBtn">Отправить</button>
                </div>
            </div>

            <!-- Blog View -->
            <div class="blog-view" id="blogView">
                <div id="blogPosts"></div>
            </div>

            <!-- New Blog Form -->
            <div class="new-blog-form" id="newBlogForm">
                <textarea placeholder="Напишите что-нибудь..." id="blogInput"></textarea>
                <button id="postBlogBtn">Опубликовать</button>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-container glass">
            <div class="settings-header">
                <h3>Настройки</h3>
                <button class="close-btn" id="closeSettingsBtn">×</button>
            </div>

            <div class="settings-section">
                <h4>Тема оформления</h4>
                <div class="theme-toggle">
                    <span>Светлая</span>
                    <div class="toggle-switch" id="themeToggle">
                        <div class="toggle-slider"></div>
                    </div>
                    <span>Темная</span>
                </div>
            </div>

            <div class="settings-section">
                <h4>Профиль</h4>
                <p style="color: var(--text-secondary); margin-bottom: 1rem;">ID пользователя: <span id="userIdDisplay" style="font-family: monospace;"></span></p>
            </div>

            <div class="settings-section">
                <h4>Удаление аккаунта</h4>
                <p style="margin-bottom: 1rem; color: var(--text-secondary);">Это действие необратимо!</p>
                <button class="danger-btn" id="deleteAccountBtn">Удалить аккаунт</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase конфигурация
        const SUPABASE_URL = 'https://epklfzbvlqzarptpwsdn.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_aa5ojwVrZ7pfLE0ec0DV5w_p3Zk2fcn';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Состояние приложения
        let currentUser = null;
        let currentChatRoom = 1;
        let currentView = 'chat';
        let messagesSubscription = null;
        let blogsSubscription = null;

        // DOM Elements
        const authModal = document.getElementById('authModal');
        const mainContainer = document.getElementById('mainContainer');
        const globalLoader = document.getElementById('global-loader-overlay');
        
        const githubLoginBtn = document.getElementById('githubLoginBtn');
        const sendMagicLinkBtn = document.getElementById('sendMagicLinkBtn');
        const loginEmailInput = document.getElementById('login-email');
        const githubStatus = document.getElementById('github-status');
        const emailStatus = document.getElementById('email-status');

        const chatList = document.getElementById('chatList');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendMessageBtn = document.getElementById('sendMessageBtn');
        const blogView = document.getElementById('blogView');
        const chatView = document.getElementById('chatView');
        const newBlogForm = document.getElementById('newBlogForm');
        const blogPosts = document.getElementById('blogPosts');
        const blogInput = document.getElementById('blogInput');
        const postBlogBtn = document.getElementById('postBlogBtn');
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        const settingsModal = document.getElementById('settingsModal');
        const settingsBtn = document.getElementById('settingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettingsBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const themeToggle = document.getElementById('themeToggle');
        const deleteAccountBtn = document.getElementById('deleteAccountBtn');
        const userIdDisplay = document.getElementById('userIdDisplay');

        // --- Initialization & Theme ---
        function loadTheme() {
            const savedTheme = localStorage.getItem('forum_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            if (savedTheme === 'dark') {
                themeToggle.classList.add('active');
            }
        }
        loadTheme();

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('forum_theme', newTheme);
            themeToggle.classList.toggle('active');
        });

        // --- Auth Logic ---
        function switchAuthTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.auth-form-group').forEach(g => g.classList.remove('active'));
            
            if (tab === 'github') {
                document.querySelector('[onclick="switchAuthTab(\'github\')"]').classList.add('active');
                document.getElementById('form-github').classList.add('active');
            } else {
                document.querySelector('[onclick="switchAuthTab(\'email\')"]').classList.add('active');
                document.getElementById('form-email').classList.add('active');
            }
        }

        // GitHub Login with Spinner
        githubLoginBtn.addEventListener('click', async () => {
            githubLoginBtn.disabled = true;
            githubLoginBtn.innerHTML = '<div class="spinner"></div> Connecting...';
            githubStatus.textContent = "";

            try {
                const { error } = await supabaseClient.auth.signInWithOAuth({
                    provider: 'github',
                    options: {
                        redirectTo: window.location.origin + window.location.pathname
                    }
                });

                if (error) throw error;
                // Browser will redirect automatically. 
                // If it doesn't, we might stay here, but usually it redirects.
                
            } catch (err) {
                console.error(err);
                githubStatus.textContent = "Ошибка: " + err.message;
                githubStatus.className = "status-msg error";
                githubLoginBtn.disabled = false;
                githubLoginBtn.innerHTML = `<svg class="github-icon" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg> Sign in via GitHub`;
            }
        });

        // Email Magic Link with Spinner
        sendMagicLinkBtn.addEventListener('click', async () => {
            const email = loginEmailInput.value.trim();
            if (!email || !email.includes('@')) {
                emailStatus.textContent = "Введите корректный email";
                emailStatus.className = "status-msg error";
                return;
            }

            sendMagicLinkBtn.disabled = true;
            sendMagicLinkBtn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin:0;"></div>';
            emailStatus.textContent = "Отправляем письмо...";
            emailStatus.className = "status-msg";

            try {
                const { error } = await supabaseClient.auth.signInWithOtp({
                    email: email,
                    options: {
                        shouldCreateUser: true,
                        emailRedirectTo: window.location.origin + window.location.pathname
                    }
                });

                if (error) throw error;

                emailStatus.textContent = "✅ Письмо отправлено! Проверьте почту.";
                emailStatus.className = "status-msg success";
                
                // Reset button after delay so they can resend if needed
                setTimeout(() => {
                    sendMagicLinkBtn.disabled = false;
                    sendMagicLinkBtn.innerText = "Отправить снова";
                }, 3000);

            } catch (err) {
                console.error(err);
                emailStatus.textContent = "❌ Ошибка: " + err.message;
                emailStatus.className = "status-msg error";
                sendMagicLinkBtn.disabled = false;
                sendMagicLinkBtn.innerText = "Отправить";
            }
        });

        // Handle Session Changes (Crucial for Magic Link Return)
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (event === 'SIGNED_IN' && session) {
                // Show full screen loader briefly while initializing app
                globalLoader.classList.add('active');
                authModal.style.display = 'none';
                
                // Small delay to ensure smooth visual transition
                setTimeout(async () => {
                    await handleSignedIn(session.user);
                    globalLoader.classList.remove('active');
                    mainContainer.classList.add('visible');
                }, 1000);

            } else if (event === 'SIGNED_OUT') {
                currentUser = null;
                mainContainer.classList.remove('visible');
                authModal.style.display = 'flex';
                // Reset auth buttons state
                githubLoginBtn.disabled = false;
                githubLoginBtn.innerHTML = `<svg class="github-icon" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg> Sign in via GitHub`;
                sendMagicLinkBtn.disabled = false;
                sendMagicLinkBtn.innerText = "Отправить";
            }
        });

        // Check existing session on load
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                handleSignedIn(session.user);
                mainContainer.classList.add('visible');
                authModal.style.display = 'none';
            } else {
                authModal.style.display = 'flex';
                mainContainer.classList.remove('visible');
            }
        });

        function handleSignedIn(user) {
            currentUser = user;
            userIdDisplay.textContent = user.id;
            loadChatRooms();
            loadMessages();
        }

        // --- App Logic (Chats & Blogs) ---
        async function loadChatRooms() {
            const { data, error } = await supabaseClient.from('chat_rooms').select('*');
            if (error) return;
            chatList.innerHTML = '';
            data.forEach(room => {
                const item = document.createElement('div');
                item.className = 'chat-item' + (room.id === currentChatRoom ? ' active' : '');
                item.textContent = room.name;
                item.onclick = () => {
                    currentChatRoom = room.id;
                    document.getElementById('currentViewTitle').textContent = room.name;
                    loadMessages();
                    loadChatRooms(); // Refresh highlight
                    if (window.innerWidth <= 768) sidebar.classList.remove('visible');
                };
                chatList.appendChild(item);
            });
        }

        async function loadMessages() {
            if (messagesSubscription) supabaseClient.removeChannel(messagesSubscription);

            const { data, error } = await supabaseClient
                .from('messages')
                .select('*, profiles(username)')
                .eq('chat_room_id', currentChatRoom)
                .order('created_at', { ascending: true });

            if (error) return;
            renderMessages(data);

            messagesSubscription = supabaseClient
                .channel(`messages:${currentChatRoom}`)
                .on('postgres_changes', 
                    { event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_room_id=eq.${currentChatRoom}` }, 
                    async (payload) => {
                        const { data: newMsg } = await supabaseClient
                            .from('messages')
                            .select('*, profiles(username)')
                            .eq('id', payload.new.id)
                            .single();
                        if(newMsg) appendMessage(newMsg);
                    }
                ).subscribe();
        }

        function renderMessages(msgs) {
            messagesContainer.innerHTML = '';
            msgs.forEach(m => appendMessage(m, false));
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function appendMessage(msg, scroll = true) {
            const el = document.createElement('div');
            el.className = 'message ' + (msg.user_id === currentUser.id ? 'own' : 'other');
            const author = msg.profiles?.username || 'Гость';
            el.innerHTML = `<div class="message-author">${author}</div><div class="message-content">${msg.content}</div>`;
            messagesContainer.appendChild(el);
            if(scroll) messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        sendMessageBtn.onclick = async () => {
            const txt = messageInput.value.trim();
            if(!txt) return;
            await supabaseClient.from('messages').insert({ chat_room_id: currentChatRoom, user_id: currentUser.id, content: txt });
            messageInput.value = '';
        };
        messageInput.onkeypress = (e) => { if(e.key==='Enter') sendMessageBtn.click(); };

        // View Switching
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                currentView = btn.dataset.view;
                
                if(currentView === 'chat') {
                    chatView.style.display = 'flex';
                    blogView.style.display = 'none';
                    newBlogForm.style.display = 'none';
                } else if (currentView === 'blog') {
                    chatView.style.display = 'none';
                    blogView.style.display = 'block';
                    newBlogForm.style.display = 'block';
                    loadBlogs();
                }
            };
        });

        async function loadBlogs() {
            if (blogsSubscription) supabaseClient.removeChannel(blogsSubscription);
            
            const { data, error } = await supabaseClient
                .from('blogs')
                .select('*, profiles(username)')
                .is('parent_id', null)
                .order('created_at', { ascending: false });
            
            if(error) return;
            blogPosts.innerHTML = '';
            for(const post of data) await renderBlogPost(post);

            blogsSubscription = supabaseClient
                .channel('blogs:changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'blogs' }, () => loadBlogs())
                .subscribe();
        }

        async function renderBlogPost(post, isReply=false) {
            const el = document.createElement('div');
            el.className = isReply ? 'blog-reply' : 'blog-post';
            const author = post.profiles?.username || 'Гость';
            el.innerHTML = `
                <div class="blog-post-header"><strong>${author}</strong><span>•</span><span>${new Date(post.created_at).toLocaleString()}</span></div>
                <div class="blog-post-content">${post.content}</div>
                ${!isReply ? `<div class="blog-post-actions"><button class="blog-action-btn" onclick="replyPrompt('${post.id}')">Ответить</button></div>` : ''}
            `;
            blogPosts.appendChild(el);

            if(!isReply) {
                const { data: replies } = await supabaseClient
                    .from('blogs')
                    .select('*, profiles(username)')
                    .eq('parent_id', post.id)
                    .order('created_at', { ascending: true });
                if(replies) for(const r of replies) await renderBlogPost(r, true);
            }
        }

        window.replyPrompt = (parentId) => {
            const ans = prompt("Ваш ответ:");
            if(ans) supabaseClient.from('blogs').insert({ user_id: currentUser.id, content: ans, parent_id: parentId });
        };

        postBlogBtn.onclick = async () => {
            const txt = blogInput.value.trim();
            if(txt) {
                await supabaseClient.from('blogs').insert({ user_id: currentUser.id, content: txt });
                blogInput.value = '';
            }
        };

        // Misc
        menuToggle.onclick = () => sidebar.classList.toggle('visible');
        settingsBtn.onclick = () => settingsModal.classList.add('visible');
        closeSettingsBtn.onclick = () => settingsModal.classList.remove('visible');
        settingsModal.onclick = (e) => { if(e.target === settingsModal) settingsModal.classList.remove('visible'); };
        
        logoutBtn.onclick = async () => {
            if(confirm("Выйти?")) {
                await supabaseClient.auth.signOut();
            }
        };

        deleteAccountBtn.onclick = async () => {
            if(confirm("Удалить аккаунт навсегда?")) {
                // Note: Requires RPC setup in DB as mentioned before
                alert("Функция удаления требует настройки RPC в Supabase.");
            }
        };
    </script>
</body>
</html>
